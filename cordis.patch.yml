# NovelForge plugin layer: start the embedded writing studio alongside DSH,
# and expose novel_forge_* conversation tools (novel 小说 + content 仿写/续写/改写
# + doc 安理会决议 + email 学术套磁) so sessions can drive it as a multi-capability shell.
- insert:
    - id: novel-forge
      name: dsh-novel-forge
      config:
        # 0 = 自动挑选空闲端口；可固定如 7390
        port: 0
        host: 127.0.0.1
        autoStart: true
        # 等待 /api/health 就绪的最长时间(ms)
        startTimeoutMs: 20000
        # 可选：数据目录（相对本包 app/ 或绝对路径），缺省为 app/data
        dataDir: null
- insert:
    - id: novel-forge-tools
      name: dsh-novel-forge/tools
      config: {}
